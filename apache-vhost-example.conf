# Optional example for XAMPP Apache.
# Adjust the path to match your actual project folder.
# Enable the Apache vhosts include in httpd.conf if it is not already enabled.
# Then add a matching hostname to the Windows hosts file (as Administrator):
# 127.0.0.1 studenthub.test

<VirtualHost *:80>
    ServerName studenthub.test
    DocumentRoot "C:/xampp/htdocs/studenthub"

    <Directory "C:/xampp/htdocs/studenthub">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require local
    </Directory>

    ErrorLog "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" common
</VirtualHost>
