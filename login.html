<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | StudentHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <span class="logo">Student<span>Hub</span></span>
      <p class="tagline">Sign in to access your student portal</p>

      <div id="loginError" class="form-error" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="auth-foot">
        Trouble signing in? <a href="contact.html">Contact support</a>
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
